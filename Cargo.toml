[package]
name = "openbrute"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
russh = "0.43"
russh-keys = "0.43"
suppaftp = { version = "6.0", default-features = false, features = ["async", "async-rustls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
url = "2.5"
serde_json = "1.0"
axum = { version = "0.7", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
tower = { version = "0.4", features = ["util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
